apiVersion: apps/v1
kind: Deployment
metadata:
  name: ycompany-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ycompany-web
  template:
    metadata:
      labels:
        app: ycompany-web
    spec:
      containers:
        - name: ycompany-web
          image: ycompany:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: AUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: ycompany-config
                  key: AUTH_URL
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: ycompany-secrets
                  key: AUTH_SECRET
            - name: AUTH_DEMO_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: ycompany-config
                  key: AUTH_DEMO_EMAIL
            - name: AUTH_DEMO_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: ycompany-secrets
                  key: AUTH_DEMO_PASSWORD_HASH
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ycompany-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: ycompany-secrets
                  key: STRIPE_WEBHOOK_SECRET
                  optional: true
            - name: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: ycompany-secrets
                  key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
            - name: NEXT_PUBLIC_SITE_URL
              valueFrom:
                configMapKeyRef:
                  name: ycompany-config
                  key: NEXT_PUBLIC_SITE_URL
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
